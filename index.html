<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Math Game</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --text-secondary: #8e8e93;
    --accent: #007aff;
    --green: #34c759;
    --red: #ff3b30;
    --orange: #ff9500;
    --btn-bg: #e5e5ea;
    --btn-active: #d1d1d6;
    --radius: 16px;
    --shadow: 0 2px 20px rgba(0,0,0,0.08);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    padding: 0;
  }

  /* Status Bar */
  .status-bar {
    width: 100%;
    max-width: 430px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 28px 6px;
    font-size: 15px;
    font-weight: 600;
  }

  /* Stats Row */
  .stats-row {
    width: 100%;
    max-width: 430px;
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 8px 20px 0;
  }

  .stat-pill {
    background: var(--card);
    border-radius: 20px;
    padding: 8px 18px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: var(--shadow);
    transition: transform 0.2s;
  }

  .stat-pill .icon {
    font-size: 16px;
  }

  .stat-pill .value {
    color: var(--accent);
  }

  /* Main Card */
  .game-card {
    width: 100%;
    max-width: 430px;
    background: var(--card);
    border-radius: 24px;
    margin: 8px 20px 0;
    padding: 16px 20px 16px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow: hidden;
  }

  .game-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--accent), var(--orange), var(--red));
    border-radius: 24px 24px 0 0;
  }

  .problem-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin-bottom: 16px;
  }

  .problem-display {
    font-size: 56px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 72px;
  }

  .problem-display .num {
    color: var(--text);
  }

  .problem-display .op {
    color: var(--orange);
    font-weight: 600;
  }

  .problem-display .equals {
    color: var(--text-secondary);
    font-weight: 600;
  }

  .answer-area {
    width: 100%;
    min-height: 64px;
    border: 3px solid var(--btn-bg);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 4px;
    transition: border-color 0.3s, background 0.3s;
    position: relative;
  }

  .answer-area.correct {
    border-color: var(--green);
    background: rgba(52, 199, 89, 0.08);
    animation: popCorrect 0.4s ease;
  }

  .answer-area.wrong {
    border-color: var(--red);
    background: rgba(255, 59, 48, 0.08);
    animation: shake 0.4s ease;
  }

  .answer-area .cursor {
    width: 3px;
    height: 40px;
    background: var(--accent);
    border-radius: 2px;
    animation: blink 1s step-end infinite;
    margin-left: 4px;
  }

  .answer-area.correct .cursor,
  .answer-area.wrong .cursor {
    display: none;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  @keyframes popCorrect {
    0% { transform: scale(1); }
    50% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  /* Feedback */
  .feedback {
    height: 32px;
    margin-top: 12px;
    font-size: 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .feedback.show {
    opacity: 1;
  }

  .feedback.correct-text { color: var(--green); }
  .feedback.wrong-text { color: var(--red); }

  /* Numpad */
  .numpad-container {
    width: 100%;
    max-width: 430px;
    padding: 16px 20px 70px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }

  .numpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    max-width: 360px;
    width: 100%;
    margin: 0 auto;
  }

  .numpad-btn {
    height: 52px;
    border: none;
    border-radius: 14px;
    background: var(--card);
    box-shadow: 0 1px 4px rgba(0,0,0,0.06), inset 0 0 0 1px rgba(0,0,0,0.04);
    font-size: 28px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    overflow: hidden;
  }

  .numpad-btn:active {
    background: var(--btn-active);
    transform: scale(0.95);
  }

  .numpad-btn.enter-btn {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 10px rgba(0, 122, 255, 0.3);
  }

  .numpad-btn.enter-btn:active {
    background: #0066d6;
  }

  .numpad-btn.backspace-btn {
    background: var(--btn-bg);
    font-size: 24px;
  }

  .numpad-btn.backspace-btn:active {
    background: #c7c7cc;
  }

  /* Ripple */
  .numpad-btn .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(0,0,0,0.08);
    transform: scale(0);
    animation: ripple-anim 0.5s ease-out;
    pointer-events: none;
  }

  @keyframes ripple-anim {
    to {
      transform: scale(3);
      opacity: 0;
    }
  }

  /* Progress bar */
  .progress-container {
    width: 100%;
    max-width: 430px;
    padding: 0 24px;
    margin-top: 12px;
  }

  .progress-bar {
    width: 100%;
    height: 6px;
    background: var(--btn-bg);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--green));
    border-radius: 3px;
    transition: width 0.4s ease;
    width: 0%;
  }

  /* Streak fire */
  .streak-fire {
    display: inline-block;
    animation: fireAnim 0.6s ease;
  }

  @keyframes fireAnim {
    0% { transform: scale(1); }
    50% { transform: scale(1.4) rotate(-10deg); }
    100% { transform: scale(1); }
  }

  /* Confetti canvas */
  #confetti-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 999;
  }

  /* Level up overlay */
  .level-up-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  .level-up-overlay.show {
    display: flex;
  }

  .level-up-card {
    background: var(--card);
    border-radius: 24px;
    padding: 40px 36px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    animation: slideUp 0.4s ease;
    max-width: 320px;
    width: 90%;
  }

  @keyframes slideUp {
    from { transform: translateY(40px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .level-up-card .emoji {
    font-size: 56px;
    margin-bottom: 12px;
  }

  .level-up-card h2 {
    font-size: 24px;
    margin-bottom: 6px;
  }

  .level-up-card p {
    color: var(--text-secondary);
    font-size: 15px;
    margin-bottom: 24px;
    line-height: 1.5;
  }

  .level-up-card button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 14px 40px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
  }

  /* Difficulty selector */
  .difficulty-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }

  .diff-btn {
    padding: 6px 14px;
    border-radius: 10px;
    border: 2px solid var(--btn-bg);
    background: transparent;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
  }

  .diff-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,122,255,0.06);
  }

  /* Responsive */
  @media (max-height: 900px) {
    .problem-display { font-size: 44px; margin-bottom: 16px; }
    .answer-area { font-size: 40px; min-height: 52px; }
    .numpad-btn { font-size: 24px; }
  }
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div class="status-bar">
  <span>🧮 Math Game</span>
  <span id="difficulty-label">Easy</span>
</div>

<div class="stats-row">
  <div class="stat-pill">
    <span class="icon">⭐</span>
    <span>Score: <span class="value" id="score">0</span></span>
  </div>
  <div class="stat-pill">
    <span class="icon">🔥</span>
    <span>Streak: <span class="value" id="streak">0</span></span>
  </div>
  <div class="stat-pill">
    <span class="icon">📊</span>
    <span id="level-label">Level 1</span>
  </div>
</div>

<div class="progress-container">
  <div class="progress-bar">
    <div class="progress-fill" id="progress-fill"></div>
  </div>
</div>

<div class="game-card">
  <div class="problem-label">Solve this</div>
  <div class="problem-display">
    <span class="num" id="num1">8</span>
    <span class="op" id="operator">+</span>
    <span class="num" id="num2">5</span>
    <span class="equals">=</span>
  </div>
  <div class="answer-area" id="answer-area">
    <span id="answer-text"></span>
    <span class="cursor"></span>
  </div>
  <div class="feedback" id="feedback"></div>
</div>

<div class="numpad-container">
  <div class="difficulty-row" id="difficulty-row" style="justify-content:center; margin-bottom:12px;">
    <button class="diff-btn active" data-diff="easy">Easy</button>
    <button class="diff-btn" data-diff="medium">Medium</button>
    <button class="diff-btn" data-diff="hard">Hard</button>
  </div>
  <div class="numpad">
    <button class="numpad-btn" data-key="1">1</button>
    <button class="numpad-btn" data-key="2">2</button>
    <button class="numpad-btn" data-key="3">3</button>
    <button class="numpad-btn" data-key="4">4</button>
    <button class="numpad-btn" data-key="5">5</button>
    <button class="numpad-btn" data-key="6">6</button>
    <button class="numpad-btn" data-key="7">7</button>
    <button class="numpad-btn" data-key="8">8</button>
    <button class="numpad-btn" data-key="9">9</button>
    <button class="numpad-btn backspace-btn" data-key="backspace">⌫</button>
    <button class="numpad-btn" data-key="0">0</button>
    <button class="numpad-btn enter-btn" data-key="enter">↵</button>
  </div>
</div>

<div class="level-up-overlay" id="level-up-overlay">
  <div class="level-up-card">
    <div class="emoji">🎉</div>
    <h2 id="level-up-title">Level Up!</h2>
    <p id="level-up-msg">You're on fire! Keep going!</p>
    <button id="level-up-btn">Continue</button>
  </div>
</div>

<script>
(function() {
  // ─── Audio Engine ───
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx;

  function ensureAudio() {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playDing() {
    ensureAudio();
    const now = audioCtx.currentTime;

    // Bright two-tone ding
    const osc1 = audioCtx.createOscillator();
    const gain1 = audioCtx.createGain();
    osc1.type = 'sine';
    osc1.frequency.setValueAtTime(880, now);
    osc1.frequency.exponentialRampToValueAtTime(1320, now + 0.08);
    gain1.gain.setValueAtTime(0.35, now);
    gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    osc1.connect(gain1).connect(audioCtx.destination);
    osc1.start(now);
    osc1.stop(now + 0.4);

    const osc2 = audioCtx.createOscillator();
    const gain2 = audioCtx.createGain();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(1320, now + 0.06);
    gain2.gain.setValueAtTime(0, now);
    gain2.gain.linearRampToValueAtTime(0.25, now + 0.06);
    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
    osc2.connect(gain2).connect(audioCtx.destination);
    osc2.start(now + 0.06);
    osc2.stop(now + 0.5);
  }

  function playBuzz() {
    ensureAudio();
    const now = audioCtx.currentTime;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(120, now);
    osc.frequency.linearRampToValueAtTime(90, now + 0.3);
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.35);

    // Sub bass thump
    const osc2 = audioCtx.createOscillator();
    const gain2 = audioCtx.createGain();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(60, now);
    gain2.gain.setValueAtTime(0.3, now);
    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
    osc2.connect(gain2).connect(audioCtx.destination);
    osc2.start(now);
    osc2.stop(now + 0.25);
  }

  function playLevelUp() {
    ensureAudio();
    const now = audioCtx.currentTime;
    const notes = [523, 659, 784, 1047];
    notes.forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + i * 0.12);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.3, now + i * 0.12);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.4);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now + i * 0.12);
      osc.stop(now + i * 0.12 + 0.4);
    });
  }

  // ─── Confetti ───
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  let confettiPieces = [];
  let confettiRunning = false;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function spawnConfetti(count = 60) {
    const colors = ['#007aff','#34c759','#ff9500','#ff3b30','#af52de','#ff2d55','#5856d6'];
    for (let i = 0; i < count; i++) {
      confettiPieces.push({
        x: Math.random() * canvas.width,
        y: -10 - Math.random() * 60,
        w: 6 + Math.random() * 6,
        h: 4 + Math.random() * 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        vx: (Math.random() - 0.5) * 4,
        vy: 2 + Math.random() * 4,
        rot: Math.random() * 360,
        rv: (Math.random() - 0.5) * 10,
        life: 1
      });
    }
    if (!confettiRunning) {
      confettiRunning = true;
      animateConfetti();
    }
  }

  function animateConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    confettiPieces.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.05;
      p.rot += p.rv;
      p.life -= 0.005;
      if (p.life > 0) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
        ctx.restore();
      }
    });
    confettiPieces = confettiPieces.filter(p => p.life > 0);
    if (confettiPieces.length > 0) {
      requestAnimationFrame(animateConfetti);
    } else {
      confettiRunning = false;
    }
  }

  // ─── Game State ───
  let currentAnswer = 0;
  let userAnswer = '';
  let score = 0;
  let streak = 0;
  let bestStreak = 0;
  let level = 1;
  let problemsSolved = 0;
  let difficulty = 'easy';
  let isLocked = false;
  const PROBLEMS_PER_LEVEL = 10;

  const difficultySettings = {
    easy:   { maxNum: 20, ops: ['+'] },
    medium: { maxNum: 30, ops: ['+', '-'] },
    hard:   { maxNum: 40, ops: ['+', '-'] }
  };

  // ─── DOM refs ───
  const num1El = document.getElementById('num1');
  const num2El = document.getElementById('num2');
  const opEl = document.getElementById('operator');
  const answerTextEl = document.getElementById('answer-text');
  const answerArea = document.getElementById('answer-area');
  const feedbackEl = document.getElementById('feedback');
  const scoreEl = document.getElementById('score');
  const streakEl = document.getElementById('streak');
  const levelLabel = document.getElementById('level-label');
  const progressFill = document.getElementById('progress-fill');
  const levelUpOverlay = document.getElementById('level-up-overlay');
  const levelUpBtn = document.getElementById('level-up-btn');
  const difficultyLabel = document.getElementById('difficulty-label');

  // ─── Problem Generation ───
  function generateProblem() {
    const settings = difficultySettings[difficulty];
    const op = settings.ops[Math.floor(Math.random() * settings.ops.length)];
    let a, b;

    if (op === '+') {
      a = Math.floor(Math.random() * (settings.maxNum + 1));
      b = Math.floor(Math.random() * (settings.maxNum + 1));
      currentAnswer = a + b;
    } else {
      a = Math.floor(Math.random() * (settings.maxNum + 1));
      b = Math.floor(Math.random() * (a + 1)); // ensure no negative
      currentAnswer = a - b;
    }

    num1El.textContent = a;
    opEl.textContent = op;
    num2El.textContent = b;
    userAnswer = '';
    answerTextEl.textContent = '';
    answerArea.className = 'answer-area';
    feedbackEl.className = 'feedback';
    feedbackEl.textContent = '';
    isLocked = false;
  }

  // ─── Update UI ───
  function updateStats() {
    scoreEl.textContent = score;
    streakEl.textContent = streak;
    levelLabel.textContent = `Level ${level}`;
    progressFill.style.width = `${(problemsSolved / PROBLEMS_PER_LEVEL) * 100}%`;
  }

  // ─── Check Answer ───
  function checkAnswer() {
    if (isLocked || userAnswer === '') return;
    isLocked = true;

    const parsed = parseInt(userAnswer, 10);

    if (parsed === currentAnswer) {
      // Correct!
      answerArea.className = 'answer-area correct';
      const streakBonus = Math.min(streak, 10);
      const points = 10 + streakBonus * 2;
      score += points;
      streak++;
      if (streak > bestStreak) bestStreak = streak;
      problemsSolved++;

      const messages = ['Correct! 🎯', 'Great job! ✨', 'Awesome! 🌟', 'Perfect! 💯', 'Nice one! 👏'];
      feedbackEl.textContent = `${messages[Math.floor(Math.random() * messages.length)]} +${points}`;
      feedbackEl.className = 'feedback show correct-text';

      playDing();

      if (streak > 0 && streak % 5 === 0) {
        spawnConfetti(40);
      }

      // Check level up
      if (problemsSolved >= PROBLEMS_PER_LEVEL) {
        setTimeout(() => levelUp(), 800);
      } else {
        setTimeout(() => generateProblem(), 1200);
      }
    } else {
      // Wrong
      answerArea.className = 'answer-area wrong';
      streak = 0;
      feedbackEl.textContent = `The answer was ${currentAnswer}`;
      feedbackEl.className = 'feedback show wrong-text';

      playBuzz();

      setTimeout(() => generateProblem(), 1800);
    }

    updateStats();
  }

  // ─── Level Up ───
  function levelUp() {
    level++;
    problemsSolved = 0;
    playLevelUp();
    spawnConfetti(80);

    document.getElementById('level-up-title').textContent = `Level ${level}!`;
    const msgs = [
      'You\'re getting faster!',
      'Math wizard in the making!',
      'Keep the streak alive!',
      'Brilliant work!',
      'Unstoppable!',
      'Math champion!'
    ];
    document.getElementById('level-up-msg').textContent = msgs[Math.floor(Math.random() * msgs.length)] + ` Best streak: ${bestStreak}`;
    levelUpOverlay.classList.add('show');
  }

  levelUpBtn.addEventListener('click', () => {
    levelUpOverlay.classList.remove('show');
    generateProblem();
    updateStats();
  });

  // ─── Input Handling ───
  function handleKey(key) {
    if (isLocked) return;

    if (key === 'backspace') {
      userAnswer = userAnswer.slice(0, -1);
    } else if (key === 'enter') {
      checkAnswer();
    } else {
      if (userAnswer.length < 3) {
        userAnswer += key;
      }
    }
    answerTextEl.textContent = userAnswer;
  }

  // Numpad buttons
  document.querySelectorAll('.numpad-btn').forEach(btn => {
    btn.addEventListener('click', function(e) {
      // Ripple effect
      const rect = this.getBoundingClientRect();
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      const size = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
      ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
      this.appendChild(ripple);
      setTimeout(() => ripple.remove(), 500);

      handleKey(this.dataset.key);
    });
  });

  // Physical keyboard support
  document.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') handleKey(e.key);
    else if (e.key === 'Backspace') handleKey('backspace');
    else if (e.key === 'Enter') handleKey('enter');
  });

  // Difficulty buttons
  document.querySelectorAll('.diff-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      difficulty = this.dataset.diff;
      difficultyLabel.textContent = difficulty.charAt(0).toUpperCase() + difficulty.slice(1);
      score = 0;
      streak = 0;
      problemsSolved = 0;
      level = 1;
      updateStats();
      generateProblem();
    });
  });

  // ─── Init ───
  generateProblem();
  updateStats();
})();
</script>
</body>
</html>
